name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by release.yml, so a release runs exactly the same checks.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, test, build, package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The real BAW exports (test/fixtures/local/) are never in the repository,
      # so the tests that need them are skipped here. Log how many.
      - name: Test
        run: npm test -- --reporter=default --reporter=json --outputFile.json=test-results.json

      - name: Report skipped tests
        if: ${{ !cancelled() && hashFiles('test-results.json') != '' }}
        run: |
          node -e '
            const r = require("./test-results.json");
            const skipped = r.numPendingTests + r.numTodoTests;
            const line = `Tests: ${r.numPassedTests} passed, ${r.numFailedTests} failed, ${skipped} skipped (no local TWX fixtures in CI), ${r.numTotalTests} total`;
            console.log(line);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Tests\n\n${line}\n`);
          '

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package

      - name: Upload .vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14
