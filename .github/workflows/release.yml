name: Release

# Runs when a version tag (v1.2.3) is pushed. It checks that the tag matches
# package.json, runs the CI checks, and creates a GitHub Release with the
# .vsix attached and the CHANGELOG section of that version as notes.
# Publishing to a marketplace is not part of this workflow.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check tag against package.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare versions
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$pkg" ]; then
            echo "::error::Tag $TAG does not match package.json version $pkg (expected v$pkg)."
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

      - name: Check CHANGELOG section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -qE "^## ${VERSION//./\\.}( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section."
            exit 1
          fi

  ci:
    name: CI
    needs: check-version
    uses: ./.github/workflows/ci.yml

  release:
    name: Create GitHub Release
    needs: [check-version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download .vsix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: dist-vsix

      - name: Extract release notes
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          # The section runs from "## <version>" to the next "## " heading.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; split($0, h, " "); if (h[2] == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::The CHANGELOG section of $VERSION is empty."
            exit 1
          fi
          cat release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          vsix="dist-vsix/lanescope-$VERSION.vsix"
          test -f "$vsix" || { echo "::error::$vsix was not built."; ls -la dist-vsix; exit 1; }
          gh release create "$TAG" "$vsix" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lanescope $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
